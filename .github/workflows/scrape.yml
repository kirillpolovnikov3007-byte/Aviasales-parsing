name: Auto Airfare Scraper

on:
  schedule:
    # Запуск каждый день в 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch: # Позволяет вам запустить парсер вручную кнопкой на GitHub

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository code
      # Используем v4 с фиксом под Node 24 (или v5, если вышла)
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 # Гарантирует корректную работу git diff

    - name: Set up Python
      # Рекомендуется проверить обновления для setup-python под Node 24
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: pip install requests pandas

    - name: Run Scraper Script
      env:
        TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
      run: python scraper.py

    - name: Commit and Push DB Changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add flights_history.db
        
        # Разворачиваем логику, чтобы видеть реальный результат в логах GitHub
        if ! git diff-index --quiet HEAD; then
          echo "Обнаружены изменения в flights_history.db. Создаем коммит..."
          git commit -m "Auto-update flight prices: $(date +'%Y-%m-%d %H:%M')"
          git push
        else
          echo "Изменений в базе данных не обнаружено. Пропускаем коммит."
        fi
